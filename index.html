<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cotizaciones Soporte IT</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f7fb;
    margin:0;
}

.header{
    background:#2f7d32;
    color:white;
    padding:20px;
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;
    min-height:105px;
}
    
    .btn{
    background:#4BA33F;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

.container{
    padding:20px;
}
.kpis{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin:20px;
}

.kpi-card{
    padding:20px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.kpi-card h3{
    margin:0;
    font-size:32px;
}

.kpi-card p{
    margin-top:10px;
}

.kpi-pendientes{
    background:#fef3c7;
    border-left:5px solid #d97706;
}

.kpi-cotizadas{
    background:#dbeafe;
    border-left:5px solid #2563eb;
}

.kpi-aprobadas{
    background:#dcfce7;
    border-left:5px solid #16a34a;
}

.kpi-rechazadas{
    background:#fee2e2;
    border-left:5px solid #dc2626;
}
.kpi-title{
    color:#666;
    font-size:14px;
}

.kpi-value{
    font-size:32px;
    font-weight:bold;
    color:#2f7d32;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

#modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);
}

.modal-content{
    background:white;
    width:700px;
    max-width:95%;
    margin:40px auto;
    padding:20px;
    border-radius:12px;
}

input,
textarea{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    box-sizing:border-box;
}

textarea{
    height:120px;
}

</style>

</head>

<body>

<div class="header">

    <h2 style="position:absolute; left:20px; margin:0;"> COTIZACIONES </h2>

     <button
            class="btn"
            onclick="abrirModal()">
            + Nueva Solicitud
        </button>

    <div style="
        position:absolute;
        right:20px;
        top:20px;
        text-align:right;
    ">

        <div id="nombreUsuario"></div>

        <div id="correoUsuario"
             style="font-size:14px;">
        </div>

        <button
            class="btn"
            onclick="cerrarSesion()"
            style="
                margin-top:10px;
                padding:8px 15px;
            ">
            Cerrar sesión
        </button>

    </div>

</div>
<div class="container">
  <div class="kpis">

    <div class="kpi-card kpi-pendientes">
        <h3 id="kpiPendientes">0</h3>
        <p>Pendientes</p>
    </div>

    <div class="kpi-card kpi-cotizadas">
        <h3 id="kpiCotizadas">0</h3>
        <p>Cotizadas</p>
    </div>

    <div class="kpi-card kpi-aprobadas">
        <h3 id="kpiAprobadas">0</h3>
        <p>Aprobadas</p>
    </div>

    <div class="kpi-card kpi-rechazadas">
        <h3 id="kpiRechazadas">0</h3>
        <p>Rechazadas</p>
    </div>

</div>
</div>

    <div class="card">

        <table>

            <thead>
                <tr>
                    <th>Ticket</th>
                    <th>Asunto</th>
                    <th>Proveedor</th>
                    <th>Estado</th>
                    <th>Precio de Cotización</th>
                    <th>Marca y modelo</th>
                    <th>Documento</th>
                    <th>Validación</th>
                </tr>
            </thead>

            <tbody id="tablaSolicitudes">
            </tbody>

        </table>

    </div>

</div>

<div id="modal">

    <div class="modal-content">

        <h2>Nueva Solicitud</h2>

        <input id="ticket" placeholder="Ticket Interno">

        <input id="solicitante" placeholder="Nombre Solicitante">

        <input id="empresa" placeholder="Empresa">

        <input id="correo" placeholder="Correo">

        <input id="telefono" placeholder="Teléfono">

        <input id="asunto" placeholder="Asunto">

        <textarea
            id="descripcion"
            placeholder="Descripción"
        ></textarea>

        <input id="proveedor" placeholder="Proveedor">

        <button class="btn" onclick="guardarSolicitud()">
            Guardar
        </button>

        <button onclick="cerrarModal()">
            Cancelar
        </button>

    </div>

</div>

<script>

const supabaseUrl =
'https://vkilesppmsjaluuqqakb.supabase.co';

const supabaseKey =
'sb_publishable_nN-Ik8NT4uaSduZj-48Xqg_o-Xt8UQ4';

const client =
supabase.createClient(
    supabaseUrl,
    supabaseKey
);

verificarSesion();

async function verificarSesion(){

    const {
        data: { session }
    } = await client.auth.getSession();

    if(!session){

        window.location.href =
            'login.html';

    }

}
    
function abrirModal(){
    document.getElementById('modal').style.display = 'block';
}

function cerrarModal(){
    document.getElementById('modal').style.display = 'none';
}

async function cerrarSesion(){

    await client.auth.signOut();

    window.location.href =
        'login.html';
}

async function guardarSolicitud(){

    const { error } =
    await client
        .from('Solicitudes')
        .insert([{

            ticket_interno:
                document.getElementById('ticket').value,

            nombre_solicitante:
                document.getElementById('solicitante').value,

            empresa:
                document.getElementById('empresa').value,

            correo:
                document.getElementById('correo').value,

            telefono:
                document.getElementById('telefono').value,

            asunto:
                document.getElementById('asunto').value,

            descripcion:
                document.getElementById('descripcion').value,

            proveedor:
                document.getElementById('proveedor').value,

            estado:'Pendiente'

        }]);

    if(error){
        alert(error.message);
        console.error(error);
        return;
    }

    cerrarModal();
    cargarSolicitudes();

    alert('Solicitud guardada');
}

async function cargarSolicitudes(){

    const {
        data: { user }
    } = await client.auth.getUser();

    const { data: soporte } =
    await client
        .from('soporte')
        .select('*')
        .eq('correo', user.email)
        .single();

    document.getElementById(
        'nombreUsuario'
    ).innerText =
        soporte.nombre || '';

    document.getElementById(
        'correoUsuario'
    ).innerText =
        soporte.correo || '';

    const { data, error } =
    await client
        .from('Solicitudes')
        .select('*');

    if(error){
        console.error(error);
        return;
    }

    const tabla =
    document.getElementById(
        'tablaSolicitudes'
    );

    tabla.innerHTML = '';

    let pendientes = 0;
    let cotizadas = 0;
    let aprobadas = 0;
    let rechazadas = 0;

    data.forEach(item => {

        if(item.estado === 'Pendiente') pendientes++;
        if(item.estado === 'Cotizada') cotizadas++;
        if(item.estado === 'Aprobada') aprobadas++;
        if(item.estado === 'Rechazada') rechazadas++;

        tabla.innerHTML += `
<tr>
    <td>${item.ticket_interno || ''}</td>
    <td>${item.asunto || ''}</td>
    <td>${item.proveedor || ''}</td>

    <td>
    ${item.estado === 'Pendiente'
        ? '<span style="color:#d97706;font-weight:bold;">Pendiente</span>'
        : item.estado === 'Cotizada'
        ? '<span style="color:#2563eb;font-weight:bold;">Cotizada</span>'
        : item.estado === 'Aprobada'
        ? '<span style="color:#16a34a;font-weight:bold;">Aprobada</span>'
        : item.estado === 'Rechazada'
        ? '<span style="color:#dc2626;font-weight:bold;">Rechazada</span>'
        : item.estado
    }
    </td>

    <td>${item.precio_cotizacion || ''}</td>

    <td>${item.observaciones || ''}</td>

    <td>
        ${
            item.archivo_url
            ? `<a href="${item.archivo_url}" target="_blank">
                📄 Ver PDF
               </a>`
            : 'Sin archivo'
        }
    </td>

    <td>
        <button onclick="aprobarSolicitud('${item.ticket_interno}')">
            Aprobar
        </button>

        <button onclick="rechazarSolicitud('${item.ticket_interno}')">
            Rechazar
        </button>
    </td>

</tr>
`;
    });

    document.getElementById('kpiPendientes').innerText = pendientes;
    document.getElementById('kpiCotizadas').innerText = cotizadas;
    document.getElementById('kpiAprobadas').innerText = aprobadas;
    document.getElementById('kpiRechazadas').innerText = rechazadas;
}
async function aprobarSolicitud(ticket){

    const { error } =
    await client
        .from('Solicitudes')
        .update({
            estado:'Aprobada'
        })
        .eq(
            'ticket_interno',
            ticket
        );

    if(error){
        alert(error.message);
        return;
    }

    cargarSolicitudes();
}

async function rechazarSolicitud(ticket){
    const { error } =
    await client
        .from('Solicitudes')
        .update({
            estado:'Rechazada'
        })
        .eq(
            'ticket_interno',
            ticket
        );

    if(error){
        alert(error.message);
        return;
    }

cargarSolicitudes();

}

cargarSolicitudes();

</script>

</body>
</html>
