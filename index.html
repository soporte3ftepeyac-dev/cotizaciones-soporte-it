<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cotizaciones Soporte IT</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f7fb;
    margin:0;
}

.header{
    background:#1e293b;
    color:white;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

#modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);
}

.modal-content{
    background:white;
    width:700px;
    max-width:95%;
    margin:40px auto;
    padding:20px;
    border-radius:12px;
}

input,
textarea{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    box-sizing:border-box;
}

textarea{
    height:120px;
}

</style>

</head>

<body>

<div class="header">

    <h2>Cotizaciones Soporte IT</h2>

    <button class="btn" onclick="abrirModal()">
        + Nueva Solicitud
    </button>
    
    <button class="btn" onclick="cerrarSesion()">
    Cerrar sesión
    </button>
    
</div>

<div class="container">

    <div class="card">

        <table>

            <thead>
                <tr>
                    <th>Ticket</th>
                    <th>Asunto</th>
                    <th>Proveedor</th>
                    <th>Estado</th>
                    <th>Precio de Cotización</th>
                    <th>Marca y modelo</th>
                    <th>Validación</th>
                </tr>
            </thead>

            <tbody id="tablaSolicitudes">
            </tbody>

        </table>

    </div>

</div>

<div id="modal">

    <div class="modal-content">

        <h2>Nueva Solicitud</h2>

        <input id="ticket" placeholder="Ticket Interno">

        <input id="solicitante" placeholder="Nombre Solicitante">

        <input id="empresa" placeholder="Empresa">

        <input id="correo" placeholder="Correo">

        <input id="telefono" placeholder="Teléfono">

        <input id="asunto" placeholder="Asunto">

        <textarea
            id="descripcion"
            placeholder="Descripción"
        ></textarea>

        <input id="proveedor" placeholder="Proveedor">

        <button class="btn" onclick="guardarSolicitud()">
            Guardar
        </button>

        <button onclick="cerrarModal()">
            Cancelar
        </button>

    </div>

</div>

<script>

const supabaseUrl =
'https://vkilesppmsjaluuqqakb.supabase.co';

const supabaseKey =
'sb_publishable_nN-Ik8NT4uaSduZj-48Xqg_o-Xt8UQ4';

const client =
supabase.createClient(
    supabaseUrl,
    supabaseKey
);

verificarSesion();

async function verificarSesion(){

    const {
        data: { session }
    } = await client.auth.getSession();

    if(!session){

        window.location.href =
            'login.html';

    }

}
    
function abrirModal(){
    document.getElementById('modal').style.display = 'block';
}

function cerrarModal(){
    document.getElementById('modal').style.display = 'none';
}

async function cerrarSesion(){

    await client.auth.signOut();

    window.location.href =
        'login.html';
}

async function guardarSolicitud(){

    const { error } =
    await client
        .from('Solicitudes')
        .insert([{

            ticket_interno:
                document.getElementById('ticket').value,

            nombre_solicitante:
                document.getElementById('solicitante').value,

            empresa:
                document.getElementById('empresa').value,

            correo:
                document.getElementById('correo').value,

            telefono:
                document.getElementById('telefono').value,

            asunto:
                document.getElementById('asunto').value,

            descripcion:
                document.getElementById('descripcion').value,

            proveedor:
                document.getElementById('proveedor').value,

            estado:'Pendiente'

        }]);

    if(error){
        alert(error.message);
        console.error(error);
        return;
    }

    cerrarModal();
    cargarSolicitudes();

    alert('Solicitud guardada');
}

async function cargarSolicitudes(){

    const { data, error } =
    await client
        .from('Solicitudes')
        .select('*');

    if(error){
        console.error(error);
        return;
    }

    const tabla =
    document.getElementById(
        'tablaSolicitudes'
    );

    tabla.innerHTML = '';

    data.forEach(item => {

        tabla.innerHTML += `
<tr>
    <td>${item.ticket_interno || ''}</td>
    <td>${item.asunto || ''}</td>
    <td>${item.proveedor || ''}</td>
    <td>${item.estado || ''}</td>
    <td>${item.precio_cotizacion || ''}</td>
    <td>${item.observaciones || ''}</td>
    <td>
        <button onclick="aprobarSolicitud('${item.ticket_interno}')">
            Aprobar
        </button>

        <button onclick="rechazarSolicitud('${item.ticket_interno}')">
            Rechazar
        </button>
    </td>
</tr>
`;
        });
async function aprobarSolicitud(ticket){

    const { error } =
    await client
        .from('Solicitudes')
        .update({
            estado:'Aprobada'
        })
        .eq(
            'ticket_interno',
            ticket
        );

    if(error){
        alert(error.message);
        return;
    }

    cargarSolicitudes();
}

async function rechazarSolicitud(ticket){

    const { error } =
    await client
        .from('Solicitudes')
        .update({
            estado:'Rechazada'
        })
        .eq(
            'ticket_interno',
            ticket
        );

    if(error){
        alert(error.message);
        return;
    }

cargarSolicitudes();


</script>

</body>
</html>
