<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cotizaciones Soporte IT</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f7fb;
    margin:0;
}

.header{
    background:#1e293b;
    color:white;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

.estado{
    font-weight:bold;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="header">
    <h2>Cotizaciones Soporte IT</h2>

    <button class="btn">
        + Nueva Solicitud
    </button>
</div>

<div class="container">

    <div class="card">

        <table>
            <thead>
                <tr>
                    <th>Ticket</th>
                    <th>Asunto</th>
                    <th>Proveedor</th>
                    <th>Estado</th>
                </tr>
            </thead>

            <tbody id="tablaSolicitudes">
            </tbody>

        </table>

    </div>

</div>

<script>

const supabaseUrl = 'https://vkilesppmsjaluuqqakb.supabase.co';
const supabaseKey = 'sb_publishable_nN-Ik8NT4uaSduZj-48Xqg_o-Xt8UQ4';

const client = supabase.createClient(
    supabaseUrl,
    supabaseKey
);

async function cargarSolicitudes() {

    const { data, error } = await client
        .from('Solicitudes')
        .select('*');

    if (error) {
        console.error('ERROR:', error);
        return;
    }

    const tabla = document.getElementById('tablaSolicitudes');

    tabla.innerHTML = '';

    data.forEach(item => {

        tabla.innerHTML += `
            <tr>
                <td>${item["ticket_interno"] || ''}</td>
                <td>${item.asunto || ''}</td>
                <td>${item.proveedor || ''}</td>
                <td>${item.estado || ''}</td>
            </tr>
        `;

    });

}

cargarSolicitudes();

</script>

</body>
</html>
