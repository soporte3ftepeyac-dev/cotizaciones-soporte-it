<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portal de Proveedores</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f7fb;
    margin:0;
}

.header{
    background:#4BA33F;
    color:white;
    padding:20px;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}
</style>

</head>

<body>

<div class="header">

    <h2>Panel de Proveedores</h2>

    <button class="btn" onclick="cerrarSesion()">
        Cerrar sesión
    </button>

</div>

<div class="container">

    <div class="card">

        <h3>Mis Solicitudes</h3>

        <table>

            <thead>
                <tr>
                    <th>Ticket</th>
                    <th>Asunto</th>
                    <th>Proveedor</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>

            <tbody id="tablaSolicitudes">
            </tbody>

        </table>

    </div>

</div>

<script>

const supabaseUrl =
'https://vkilesppmsjaluuqqakb.supabase.co';

const supabaseKey =
'sb_publishable_nN-Ik8NT4uaSduZj-48Xqg_o-Xt8UQ4';

const client =
    supabase.createClient(
        supabaseUrl,
        supabaseKey
    );

async function cerrarSesion(){

    await client.auth.signOut();

    window.location.href =
        'login.html';

}

verificarSesion();

async function verificarSesion(){

    const {
        data: { session }
    } = await client.auth.getSession();

    if(!session){

        window.location.href =
            'login.html';

    }

}

async function cargarSolicitudes(){

    const { data, error } =
        await client
        .from('Solicitudes')
        .select('*');

    if(error){
        console.error(error);
        return;
    }

    const tabla =
        document.getElementById(
            'tablaSolicitudes'
        );

    tabla.innerHTML = '';

    data.forEach(item => {

        tabla.innerHTML += `
           <td>${item.ticket_interno || ''}</td>
<td>${item.asunto || ''}</td>
<td>${item.proveedor || ''}</td>
<td>${item.estado || ''}</td>

<td>
    <button onclick="verCotizar('${item.ticket_interno}')">
        Ver / Cotizar
    </button>
</td>
        `;

    });

}

function verCotizar(ticket){

    window.location.href =
        'detalle.html?ticket=' +
        ticket;

}
cargarSolicitudes();

</script>

</body>
</html>
