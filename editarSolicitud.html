<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Editar Solicitud</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body>

<h2>Editar Solicitud</h2>

<input id="ticket" placeholder="Ticket Interno">

<input id="solicitante" placeholder="Nombre Solicitante">

<input id="empresa" placeholder="Empresa">

<input id="correo" placeholder="Correo">

<input id="telefono" placeholder="Teléfono">

<input id="asunto" placeholder="Asunto">

<textarea id="descripcion"></textarea>

<input id="proveedor" placeholder="Proveedor">

<textarea id="domicilio"></textarea>

<button onclick="guardarCambios()">
    Guardar cambios
</button>

</body>
</html>
